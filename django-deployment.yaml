kind: Deployment
apiVersion: apps/v1

metadata:
 name: django-deployment
 namespace: sunil-namespace

spec:
 replicas: 2
 selector:
  matchLabels:
   app : nginx
 template:
  metadata:
   labels:
    app : nginx
  spec: 
   containers:
   - name: nginx
     image: skforever99/nginx-app:latest
     ports:
     - containerPort: 8000
